[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.2",
    "livekit-agents[fishaudio,groq,langchain]~=1.8",
    "livekit-api>=1.2.1",
    "livekit-plugins-ai-coustics~=0.3",
    "livekit-plugins-assemblyai>=1.8.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0.55",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
